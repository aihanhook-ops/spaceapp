name: Fedora SELinux rootless Podman validation

on:
  push:
    branches: [codex/issue63-validation]
  workflow_dispatch:
    inputs:
      profile:
        description: Real profile to validate; large requires separate hardware
        type: choice
        options: [small, medium]
        default: small
        required: true

permissions:
  contents: read

jobs:
  fedora:
    # Standard public runners are free. Never use private or paid runner labels.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["small","medium"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Boot verified Fedora and run the existing acceptance harness
        timeout-minutes: 41
        shell: bash
        env:
          ACCEPTANCE_PROFILE: ${{ matrix.profile }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          case "$ACCEPTANCE_PROFILE" in small|medium) ;; *) exit 2 ;; esac
          work="$RUNNER_TEMP/spaceapp-fedora"
          mkdir "$work"
          phase=host-gates
          # The only published logs are stage markers and an allowlisted proof record.
          cat > "$RUNNER_TEMP/spaceapp-fedora-cleanup.py" <<'PY'
          import os, pathlib, shutil, signal, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'spaceapp-fedora'
          pidfile = root / 'qemu.pid'
          def running(pid):
              try:
                  args = pathlib.Path(f'/proc/{pid}/cmdline').read_bytes().split(b'\0')
                  return any(str(root / 'vm.qcow2').encode() in arg for arg in args) and b'qemu-system-x86_64' in pathlib.Path(f'/proc/{pid}/exe').resolve().name.encode()
              except FileNotFoundError:
                  return False
          if pidfile.exists():
              pid = int(pidfile.read_text().strip())
              if pid <= 1:
                  raise SystemExit('Invalid owned VM PID')
              if running(pid):
                  os.kill(pid, signal.SIGTERM)
                  for _ in range(50):
                      if not running(pid):
                          break
                      time.sleep(0.1)
                  if running(pid):
                      os.kill(pid, signal.SIGKILL)
                  for _ in range(50):
                      if not running(pid):
                          break
                      time.sleep(0.1)
                  if running(pid):
                      raise SystemExit('Owned VM did not stop; preserving its disk')
          shutil.rmtree(root, ignore_errors=False) if root.exists() else None
          print('FEDORA_VM_CLEANED=true')
          PY
          finish() {
            result=$?
            trap - EXIT INT TERM
            if test "$result" -ne 0; then
              if test "$phase" = fedora-boot; then
                sudo journalctl -k --no-pager -n 200 \
                  --grep='apparmor="DENIED".*(qemu|/dev/kvm)|comm="qemu-system' 2>&1 | \
                  tee "$work/kvm-audit.raw" > /dev/null || true
              fi
              python3 - "$work" "$phase" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          files = {
              'host-tools': ['apt.raw'], 'verified-downloads': ['gpg.raw', 'compose-download.raw'],
              'fedora-boot': ['qemu.raw', 'ssh.raw', 'cloud-init.raw', 'kvm-audit.raw'],
              'fedora-bootstrap': ['scp.raw', 'bootstrap.raw', 'extract.raw'],
              'real-podman-acceptance': ['proof.raw'],
          }.get(sys.argv[2], [])
          redact = re.compile(r'setup.?token|password|passwd|secret|postgres(?:ql)?://|refresh.?token|authorization|bearer|github_pat_|gh[pousr]_|PRIVATE KEY|ssh-ed25519|ssh-rsa', re.I)
          output = []
          for name in files:
              path = root / name
              if path.exists():
                  output.append('DIAGNOSTIC_FILE=' + name)
                  for line in path.read_text(errors='replace').splitlines()[-40:]:
                      line = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', line)
                      output.append('[redacted]' if redact.search(line) else ''.join(c for c in line if c == '\t' or c.isprintable()))
          # Never read key, user-data, serial output or an unbounded log.
          for line in '\n'.join(output)[-12000:].splitlines():
              print('DIAGNOSTIC ' + line)
          PY
            fi
            if ! python3 "$RUNNER_TEMP/spaceapp-fedora-cleanup.py"; then result=1; fi
            printf 'FEDORA_VALIDATION_EXIT=%s stage=%s\n' "$result" "$phase"
            exit "$result"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf 'FEDORA_STAGE=%s\n' "$phase"
          python3 - "$work" <<'PY'
          import os, pathlib, platform, shutil, sys
          assert platform.machine() == 'x86_64', 'x86_64 runner required'
          assert len(os.sched_getaffinity(0)) >= 4, 'Four actual host CPUs required'
          mem = dict(line.split(':', 1) for line in pathlib.Path('/proc/meminfo').read_text().splitlines())
          assert int(mem['MemAvailable'].split()[0]) * 1024 >= 13 * 1024**3, 'Need 13 GiB currently available host RAM'
          free = shutil.disk_usage(sys.argv[1]).free
          assert free >= 25 * 1024**3, 'Need 25 GiB measured host headroom before installing tools'
          print(f'HOST_FREE_BYTES={free}')
          PY
          sudo python3 - <<'PY'
          import fcntl, os
          fd = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
          assert fcntl.ioctl(fd, 0xAE00, 0) == 12, 'KVM API 12 required'
          vm = fcntl.ioctl(fd, 0xAE01, 0)
          os.close(vm)
          os.close(fd)
          print('KVM_API=12 KVM_CREATE_VM=passed')
          PY
          phase=host-tools
          printf 'FEDORA_STAGE=%s\n' "$phase"
          timeout 180s sudo apt-get update > "$work/apt.raw" 2>&1
          timeout 180s sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils gnupg acl >> "$work/apt.raw" 2>&1
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          # Check the same API as the unprivileged QEMU user, with no TCG fallback.
          python3 - <<'PY'
          import fcntl, os
          fd = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
          assert fcntl.ioctl(fd, 0xAE00, 0) == 12
          vm = fcntl.ioctl(fd, 0xAE01, 0)
          os.close(vm)
          os.close(fd)
          PY
          python3 - "$work" <<'PY'
          import shutil, sys
          assert shutil.disk_usage(sys.argv[1]).free >= 24 * 1024**3, 'Need 24 GiB free before downloading or starting the VM'
          PY
          phase=verified-downloads
          printf 'FEDORA_STAGE=%s\n' "$phase"
          image=Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
          base=https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --max-time 240 "$base/$image" -o "$work/$image"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --max-time 60 "$base/Fedora-Cloud-44-1.7-x86_64-CHECKSUM" -o "$work/CHECKSUM"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --max-time 60 https://fedoraproject.org/fedora.gpg -o "$work/fedora.gpg"
          mkdir "$work/gnupg"
          gpg --batch --homedir "$work/gnupg" --import "$work/fedora.gpg" > "$work/gpg.raw" 2>&1
          # Fedora's published Fedora 44 certificate fingerprint, independently pinned.
          gpg --batch --homedir "$work/gnupg" --export \
            36F612DCF27F7D1A48A835E4DBFCF71C6D9F90A6 > "$work/trusted.gpg"
          test -s "$work/trusted.gpg"
          gpgv --homedir "$work/gnupg" --keyring "$work/trusted.gpg" \
            "$work/CHECKSUM" >> "$work/gpg.raw" 2>&1
          # gpgv verifies cleartext signatures but does not consistently extract their text.
          gpg --batch --homedir "$work/gnupg" --no-default-keyring --keyring "$work/trusted.gpg" \
            --output "$work/checksums.txt" --decrypt "$work/CHECKSUM" >> "$work/gpg.raw" 2>&1
          python3 - "$work" "$image" <<'PY'
          import hashlib, pathlib, re, sys
          root, name = pathlib.Path(sys.argv[1]), sys.argv[2]
          lines = re.findall(r'^SHA256 \(' + re.escape(name) + r'\) = ([0-9a-f]{64})$', (root / 'checksums.txt').read_text(), re.M)
          assert lines == ['28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f'], 'Exact signed image checksum missing or changed'
          digest = hashlib.sha256()
          with (root / name).open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(chunk)
          assert digest.hexdigest() == lines[0], 'Image checksum mismatch'
          print('FEDORA_IMAGE_SIGNATURE_AND_SHA256=verified')
          PY
          timeout 120s gh release download v2.38.2 --repo docker/compose \
            --pattern docker-compose-linux-x86_64 --dir "$work" > "$work/compose-download.raw" 2>&1
          unset GH_TOKEN
          printf '%s  %s\n' 486b3ffc0f806ca2efbc430cef89955386011662f0c76bad17c103d059cfa9cf \
            "$work/docker-compose-linux-x86_64" | sha256sum --check
          # No working-tree files, .git metadata, credentials, or host environment.
          git archive --format=tar HEAD packages/run-spaceapp | gzip > "$work/launcher.tar.gz"
          printf '%s\n' "$ACCEPTANCE_PROFILE" > "$work/profile"
          ssh-keygen -q -t ed25519 -N '' -f "$work/key"
          cat > "$work/user-data" <<'EOF'
          #cloud-config
          disable_root: true
          ssh_pwauth: false
          users:
            - name: fedora
              lock_passwd: true
              shell: /bin/bash
              groups: [wheel]
              sudo: ["ALL=(ALL) NOPASSWD:ALL"]
              ssh_authorized_keys:
          EOF
          printf '      - %s\n' "$(cat "$work/key.pub")" >> "$work/user-data"
          printf 'instance-id: spaceapp-fedora-validation\nlocal-hostname: spaceapp-fedora\n' > "$work/meta-data"
          cloud-localds "$work/seed.iso" "$work/user-data" "$work/meta-data"
          qemu-img create -q -f qcow2 -F qcow2 -b "$work/$image" "$work/vm.qcow2" 20G
          phase=fedora-boot
          printf 'FEDORA_STAGE=%s\n' "$phase"
          printf 'QEMU_PATH=%s\n' "$(command -v qemu-system-x86_64)"
          /usr/bin/qemu-system-x86_64 --version
          # Settle pending device events and recheck access at the actual launch boundary.
          sudo udevadm settle --timeout=30
          getfacl --absolute-names /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          getfacl --absolute-names /dev/kvm
          sudo -n /usr/sbin/runuser -u "$(id -un)" -g kvm -- python3 - <<'PY'
          import fcntl, os, pathlib
          assert os.geteuid() != 0, 'The QEMU probe must retain an unprivileged UID'
          assert os.getegid() == os.stat('/dev/kvm').st_gid, 'The probe must use the KVM device group'
          print('KVM_RUNNER_EUID=' + str(os.geteuid()))
          print('KVM_RUNNER_EGID=' + str(os.getegid()))
          print('KVM_RUNNER_LSM=' + pathlib.Path('/proc/self/attr/current').read_text().strip())
          fd = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
          assert fcntl.ioctl(fd, 0xAE00, 0) == 12
          vm = fcntl.ioctl(fd, 0xAE01, 0)
          os.close(vm)
          os.close(fd)
          print('KVM_RUNNER_API=12 KVM_CREATE_VM=passed')
          PY
          # Keep the runner UID; use the device's stable group without widening its mode.
          {
            sudo -n /usr/sbin/runuser -u "$(id -un)" -g kvm -- /usr/bin/qemu-system-x86_64 \
              -daemonize -pidfile "$work/qemu.pid" -name spaceapp-fedora-validation -machine q35,accel=kvm -cpu host \
              -smp 4 -m 12288 -display none -monitor none -serial "file:$work/serial.raw" -no-reboot \
              -drive "file=$work/vm.qcow2,if=virtio,format=qcow2,discard=unmap" \
              -drive "file=$work/seed.iso,if=virtio,format=raw,readonly=on" \
              -nic user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:2222-:22
          } > "$work/qemu.raw" 2>&1
          test -s "$work/qemu.pid"
          ssh_opts=(-i "$work/key" -p 2222 -o BatchMode=yes -o IdentitiesOnly=yes \
            -o IdentityAgent=none -o ForwardAgent=no -o StrictHostKeyChecking=accept-new \
            -o "UserKnownHostsFile=$work/known_hosts" -o ConnectTimeout=5)
          for _ in $(seq 1 60); do
            if ssh "${ssh_opts[@]}" fedora@127.0.0.1 true > "$work/ssh.raw" 2>&1; then break; fi
            kill -0 "$(cat "$work/qemu.pid")"
            sleep 2
          done
          ssh "${ssh_opts[@]}" fedora@127.0.0.1 \
            'timeout 120s cloud-init status --wait' > "$work/cloud-init.raw" 2>&1
          cat > "$work/bootstrap.sh" <<'EOF'
          set -euo pipefail
          test "$(getenforce)" = Enforcing
          dnf -y --setopt=install_weak_deps=False install \
            podman nodejs shadow-utils shadow-utils-subid slirp4netns passt fuse-overlayfs policycoreutils
          dnf clean all
          test -x /usr/bin/newuidmap
          test -x /usr/bin/newgidmap
          for mapping in /etc/subuid /etc/subgid; do
            if ! awk -F: '$1=="fedora" && $3>=65536 {found=1} END {exit !found}' "$mapping"; then
              # Fresh guest only: refuse overlapping ranges before allocating this user.
              awk -F: '$1!="fedora" && $2<165536 && $2+$3>100000 {exit 1}' "$mapping"
              case "$mapping" in
                /etc/subuid) usermod --add-subuids 100000-165535 fedora ;;
                /etc/subgid) usermod --add-subgids 100000-165535 fedora ;;
              esac
            fi
          done
          install -m 0755 /home/fedora/docker-compose-linux-x86_64 /usr/local/bin/docker-compose
          restorecon /usr/local/bin/docker-compose
          mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' > /etc/systemd/system/user@.service.d/delegate.conf
          systemctl daemon-reload
          loginctl enable-linger fedora
          systemctl restart "user@$(id -u fedora).service"
          test "$(systemctl show "user@$(id -u fedora).service" --property=Delegate --value)" = yes
          user_cgroup=$(systemctl show "user@$(id -u fedora).service" --property=ControlGroup --value)
          test -n "$user_cgroup"
          grep -qw cpu "/sys/fs/cgroup$user_cgroup/cgroup.controllers"
          grep -qw memory "/sys/fs/cgroup$user_cgroup/cgroup.controllers"
          test "$(getenforce)" = Enforcing
          EOF
          cat > "$work/run-proof.sh" <<'EOF'
          set -euo pipefail
          test "$(id -u)" -ne 0
          profile=$(cat /home/fedora/profile)
          case "$profile" in small|medium) ;; *) exit 2 ;; esac
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          export PODMAN_COMPOSE_PROVIDER=docker-compose SPACEAPP_TELEMETRY=0
          state=/home/fedora/acceptance-state.json
          proof=/home/fedora/packages/run-spaceapp/tests/podman-acceptance.mjs
          raw=/home/fedora/acceptance.raw
          : > "$raw"
          clean() {
            result=$?
            trap - EXIT INT TERM
            set +e
            timeout --signal=TERM --kill-after=10s 120s node "$proof" --cleanup "$state" >> "$raw" 2>&1
            if test "$?" -ne 0; then result=1; fi
            after=$(getenforce)
            printf 'SELINUX_AFTER=%s\n' "$after"
            if test "$after" != Enforcing; then result=1; fi
            systemctl --user stop podman.socket podman.service >> "$raw" 2>&1
            if test "$?" -ne 0; then result=1; fi
            cat "$raw"
            exit "$result"
          }
          trap clean EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          before=$(getenforce)
          printf 'SELINUX_BEFORE=%s\n' "$before"
          test "$before" = Enforcing
          node -e 'const [a,b]=process.versions.node.split(".").map(Number); if(a<20||(a===20&&b<11)) process.exit(1)'
          printf 'NODE_VERSION=%s\n' "$(node --version)"
          printf 'PODMAN_VERSION=%s\n' "$(podman --version)"
          printf 'COMPOSE_VERSION=%s\n' "$(docker-compose version --short)"
          systemctl --user start podman.socket
          test -S "$XDG_RUNTIME_DIR/podman/podman.sock"
          timeout --signal=TERM --kill-after=60s 21m node "$proof" \
            --profile "$profile" --source-version 1.1.4 --target-version 1.1.5 --state-file "$state" > "$raw" 2>&1
          EOF
          # Source files and fixtures live on the guest's native SELinux filesystem.
          scp_opts=(-i "$work/key" -P 2222 -o BatchMode=yes -o IdentitiesOnly=yes \
            -o IdentityAgent=none -o ForwardAgent=no -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$work/known_hosts" -o ConnectTimeout=5)
          scp "${scp_opts[@]}" "$work/launcher.tar.gz" "$work/docker-compose-linux-x86_64" \
            "$work/bootstrap.sh" "$work/run-proof.sh" "$work/profile" \
            fedora@127.0.0.1:/home/fedora/ > "$work/scp.raw" 2>&1
          phase=fedora-bootstrap
          printf 'FEDORA_STAGE=%s\n' "$phase"
          timeout --signal=TERM --kill-after=15s 360s ssh "${ssh_opts[@]}" fedora@127.0.0.1 \
            'sudo env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root bash --noprofile --norc /home/fedora/bootstrap.sh' \
            > "$work/bootstrap.raw" 2>&1
          ssh "${ssh_opts[@]}" fedora@127.0.0.1 \
            'cd /home/fedora && tar -xzf launcher.tar.gz && rm launcher.tar.gz' > "$work/extract.raw" 2>&1
          phase=real-podman-acceptance
          printf 'FEDORA_STAGE=%s\n' "$phase"
          set +e
          timeout --signal=TERM --kill-after=30s 24m ssh "${ssh_opts[@]}" fedora@127.0.0.1 \
            'env -i HOME=/home/fedora USER=fedora LOGNAME=fedora PATH=/usr/local/bin:/usr/bin:/bin bash --noprofile --norc /home/fedora/run-proof.sh' \
            > "$work/proof.raw" 2>&1
          proof_result=$?
          set -e
          python3 - "$work/proof.raw" "$proof_result" "$ACCEPTANCE_PROFILE" <<'PY'
          import json, pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          records = []
          before = after = False
          for line in lines:
              if line == 'SELINUX_BEFORE=Enforcing':
                  before = True
                  print(line)
              elif line == 'SELINUX_AFTER=Enforcing':
                  after = True
                  print(line)
              elif re.fullmatch(r'(NODE_VERSION=v[0-9.]+|PODMAN_VERSION=podman version [0-9.]+|COMPOSE_VERSION=v?[0-9.]+)', line):
                  print(line)
              elif re.fullmatch(r'Podman acceptance: [a-z ]+', line):
                  print(line)
              elif line.startswith('{'):
                  try:
                      record = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if record.get('mode') == 'REAL_PODMAN':
                      records.append(record)
          assert sys.argv[2] == '0', 'Guest proof failed; unpublished raw logs were discarded'
          assert before and after, 'SELinux Enforcing must be observed before and after acceptance'
          assert len(records) == 1, 'Expected exactly one actual harness success record'
          record = records[0]
          assert record.get('passed') is True and record.get('cleaned') is True
          assert record.get('profile') == sys.argv[3]
          assert record.get('sourceVersion') == '1.1.4' and record.get('targetVersion') == '1.1.5'
          # Retain evidence, omit free-form diagnostic strings and host paths.
          safe = {key: record[key] for key in ['mode', 'passed', 'cleaned', 'profile', 'sourceVersion', 'targetVersion', 'appliedLimits', 'phases']}
          facts = record['engineInfo']
          keys = ['engine', 'available', 'cliVersion', 'version', 'composeProvider', 'composeVersion', 'rootless', 'cgroupVersion', 'cpuLimitDelegated', 'memoryLimitDelegated', 'cpuCount', 'memoryBytes', 'freeDiskBytes', 'architecture', 'machine']
          safe['engineInfo'] = {key: facts.get(key) for key in keys}
          assert facts.get('rootless') is True and facts.get('cgroupVersion') == 'v2'
          assert facts.get('cpuLimitDelegated') is True and facts.get('memoryLimitDelegated') is True
          assert facts.get('cpuCount') == 4
          assert facts.get('memoryBytes') >= (7 if sys.argv[3] == 'small' else 11) * 1024**3
          assert facts.get('machine') is None
          assert all(check.get('ok') is True for check in facts['checks'])
          print(json.dumps(safe, sort_keys=True))
          PY
          phase=complete

      - name: Always stop the owned VM and delete its ephemeral disk and key
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/spaceapp-fedora-cleanup.py"; then
            python3 "$RUNNER_TEMP/spaceapp-fedora-cleanup.py"
            rm "$RUNNER_TEMP/spaceapp-fedora-cleanup.py"
          fi
